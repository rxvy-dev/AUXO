# AUXO 5.0 performance defaults (shipped by auxo-tools in /usr/lib/sysctl.d).
# Override any line with your own file in /etc/sysctl.d (same name = replaces this one).

# keep folder/file metadata cached longer: snappier file managers and app starts
vm.vfs_cache_pressure = 50
# write big copies (USB sticks, downloads) out in smaller chunks: no multi-second freezes
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
# many games (Steam, Proton) and some apps need more memory maps than the default
vm.max_map_count = 1048576
# editors and sync tools watch lots of files
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
# the NMI watchdog only matters for kernel debugging; off saves a little power and CPU
kernel.nmi_watchdog = 0
# faster reconnects for apps that support TCP Fast Open; fair queueing against lag spikes
net.ipv4.tcp_fastopen = 3
net.core.default_qdisc = fq_codel
