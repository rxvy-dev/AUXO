source = ~/.config/auxo/colors-hyprland.conf
background {
    path = ~/.config/auxo/wallpaper.png
    blur_passes = 3
    brightness = 0.6
}
label {
    text = $TIME
    font_size = 72
    font_family = Fira Code Bold
    color = rgba(e8e8f0ff)
    position = 0, 160
    halign = center
    valign = center
}
input-field {
    size = 320, 56
    outline_thickness = 2
    outer_color = rgb(ff2bd6) rgb(22e6ff) 45deg
    inner_color = rgba(090914ee)
    font_color = rgba(e8e8f0ff)
    placeholder_text = <i>&gt; password_</i>
    rounding = 2
    position = 0, -40
    halign = center
    valign = center
}
