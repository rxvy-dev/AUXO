# ── Auxo Hyprland · Neon style ───────────────────────────────────────
# Cyberpunk: magenta-to-cyan borders that slowly turn, a terminal-style bar on top.
# Back to the normal Auxo style: auxo-tweak style auxo

general {
    col.active_border = rgb(ff2bd6) rgb(22e6ff) rgb(ff2bd6) 45deg
    col.inactive_border = rgba(22e6ff30)
}
decoration {
    shadow {
        enabled = true
        range = 22
        render_power = 2
        color = rgba(ff2bd666)          # the glow around the focused window
        color_inactive = rgba(00000000)
    }
    blur {
        enabled = true
        size = 5
        passes = 2
        vibrancy = 0.3
    }
    dim_inactive = true
    dim_strength = 0.12
}
animations {
    bezier = snap, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 3, snap, slide
    animation = windowsOut, 1, 3, snap, popin 90%
    animation = border, 1, 6, default
    animation = borderangle, 1, 40, default, loop     # the border colours keep moving
    animation = workspaces, 1, 3, snap, slidevert
    animation = fade, 1, 3, default
}
layerrule = blur, waybar
layerrule = ignorezero, waybar
