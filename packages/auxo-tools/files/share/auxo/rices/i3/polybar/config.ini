include-file = ~/.config/auxo/colors-polybar.ini

[bar/auxo]
width = 100%:-24
offset-x = 12
offset-y = 8
height = 30
radius = 12
background = ${auxo.bg}
foreground = ${auxo.fg}
border-size = 1
border-color = ${auxo.accent}
padding = 2
module-margin = 1
font-0 = Inter:size=10;2
font-1 = Font Awesome 6 Free Solid:size=10;2
font-2 = JetBrains Mono:size=10;2
modules-left = logo xworkspaces
modules-center = date
modules-right = pulseaudio network cpu memory battery
tray-position = right
wm-restack = i3
override-redirect = true

[module/logo]
type = custom/text
format = ▲
format-foreground = ${auxo.accent}
click-left = alacritty -e auxo-tweak

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${auxo.accent}
label-active-foreground = ${auxo.bg}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${auxo.muted}
label-empty-padding = 1

[module/date]
type = internal/date
date = %a %d %b  %H:%M
label-font = 1

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume =  %percentage%%
label-muted =  muted

[module/network]
type = internal/network
interface-type = wireless
label-connected =  %essid%
label-disconnected = offline

[module/cpu]
type = internal/cpu
label =  %percentage%%

[module/memory]
type = internal/memory
label =  %percentage_used%%

[module/battery]
type = internal/battery
label-charging =  %percentage%%
label-discharging =  %percentage%%
