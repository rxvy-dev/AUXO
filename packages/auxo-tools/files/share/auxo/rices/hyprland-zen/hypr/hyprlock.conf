source = ~/.config/auxo/colors-hyprland.conf
background {
    path = ~/.config/auxo/wallpaper.png
    blur_passes = 3
    brightness = 0.85
}
label {
    text = $TIME
    font_size = 72
    font_family = Inter Light
    color = rgba(e8e8f0ff)
    position = 0, 160
    halign = center
    valign = center
}
input-field {
    size = 320, 56
    outline_thickness = 0
    outer_color = $accent
    inner_color = rgba(f4f1eaee)
    font_color = rgba(2b2d27ff)
    placeholder_text = <i>breathe…</i>
    rounding = 28
    position = 0, -40
    halign = center
    valign = center
}
