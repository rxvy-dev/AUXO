# ── Auxo Hyprland · Zen style ────────────────────────────────────────
# Calm and minimal: wide gaps, no borders, soft shadows, a slim bar at the bottom.
# Back to the normal Auxo style: auxo-tweak style auxo

general {
    col.active_border = rgba(00000000)
    col.inactive_border = rgba(00000000)
}
decoration {
    inactive_opacity = 1.0
    shadow {
        enabled = true
        range = 30
        render_power = 4
        color = rgba(1d1f1a33)
        color_inactive = rgba(1d1f1a1a)
        offset = 0, 8
    }
}
animations {
    bezier = calm, 0.25, 0.8, 0.25, 1
    animation = windows, 1, 6, calm, popin 96%
    animation = windowsOut, 1, 5, calm, popin 96%
    animation = fade, 1, 6, calm
    animation = workspaces, 1, 7, calm, fade
    animation = border, 0
    animation = borderangle, 0
}
