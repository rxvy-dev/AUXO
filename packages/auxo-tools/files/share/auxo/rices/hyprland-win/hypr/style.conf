# ── Auxo Hyprland · Windows style ────────────────────────────────────
# A taskbar at the bottom with Start in the middle, Quick settings, Windows keys.
# Back to the normal Auxo style: auxo-tweak rice hyprland

# Windows 11 windows: small corners, thin border, Mica-like soft blur behind see-through parts
decoration {
    blur {
        enabled = true
        size = 12
        passes = 3
        vibrancy = 0.2
        brightness = 1.0
        popups = true
    }
    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000055)
        color_inactive = rgba(00000030)
        offset = 0, 6
    }
}
general {
    col.active_border = rgba(ffffff30)
    col.inactive_border = rgba(ffffff14)
}

# windows rise into place; minimise and restore slide
animations {
    bezier = fluent, 0.1, 0.9, 0.2, 1
    animation = windows, 1, 3, fluent, slide bottom
    animation = windowsOut, 1, 2, fluent, popin 92%
    animation = workspaces, 1, 4, fluent, slidefade 15%
    animation = fade, 1, 3, fluent
    animation = border, 0
    animation = borderangle, 0
}

layerrule = blur, waybar
layerrule = ignorezero, waybar

# Start and Quick settings: acrylic panels that place themselves above the taskbar
windowrulev2 = float, class:^(auxo-start|auxo-quick)$
windowrulev2 = noborder, class:^(auxo-start|auxo-quick)$
windowrulev2 = rounding 10, class:^(auxo-start|auxo-quick)$
windowrulev2 = animation slide bottom, class:^(auxo-start|auxo-quick)$
windowrulev2 = float, class:^(auxo-settings|org.gnome.Calculator|pavucontrol)$

# Windows keys (the normal Auxo keys still work, except the ones Windows uses differently)
unbind = $mod SHIFT, S
unbind = $mod, D
bindr = SUPER, SUPER_L, exec, pkill -f auxo-launcher || auxo-launcher --style windows
bind = $mod, D, exec, pkill -f auxo-launcher || auxo-launcher --style windows
bind = ALT, F4, killactive
bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mod, A, exec, pkill -f auxo-control || auxo-control --style windows
bind = $mod, Down, movetoworkspacesilent, special:minimized
bind = $mod SHIFT, Down, togglespecialworkspace, minimized
bind = $mod, Up, fullscreen, 1
