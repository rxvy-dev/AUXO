# Auxo Hyprland · Windows style lock screen
source = ~/.config/auxo/colors-hyprland.conf
general {
    hide_cursor = true
}
background {
    path = ~/.config/auxo/wallpaper.png
    blur_passes = 3
    blur_size = 10
    brightness = 0.75
}
label {
    text = $TIME
    font_size = 96
    font_family = Inter SemiBold
    color = rgba(ffffffee)
    position = 0, 260
    halign = center
    valign = center
}
label {
    text = cmd[update:60000] date +"%A, %B %-d"
    font_size = 22
    font_family = Inter
    color = rgba(ffffffdd)
    position = 0, 170
    halign = center
    valign = center
}
image {
    path = ~/.face
    size = 150
    rounding = -1
    border_size = 0
    position = 0, -40
    halign = center
    valign = center
}
label {
    text = $USER
    font_size = 22
    font_family = Inter SemiBold
    color = rgba(ffffffee)
    position = 0, -150
    halign = center
    valign = center
}
input-field {
    size = 300, 40
    outline_thickness = 0
    inner_color = rgba(00000055)
    font_color = rgba(ffffffff)
    placeholder_text = PIN or password
    rounding = 6
    fade_on_empty = false
    position = 0, -210
    halign = center
    valign = center
}
