# ── Auxo Hyprland rice ────────────────────────────────────────────
# Colours come from ~/.config/auxo (change them with: auxo-tweak accent <name>)
source = ~/.config/auxo/colors-hyprland.conf

monitor = , preferred, auto, 1

$terminal = kitty
$menu     = wofi --show drun
$files    = thunar
$mod      = SUPER

exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = mako
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = auxo-tweak session-apply --once

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland,x11
# NVIDIA (harmless elsewhere)
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = $accent $accent2 45deg
    col.inactive_border = $inactive
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.94
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000088)
    }
    blur {
        enabled = true
        size = 6
        passes = 3
        vibrancy = 0.18
    }
}

animations {
    enabled = true
    bezier = climb, 0.16, 1, 0.3, 1
    animation = windows, 1, 5, climb, slide
    animation = windowsOut, 1, 4, climb, popin 80%
    animation = border, 1, 8, default
    animation = borderangle, 1, 60, default, loop
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, climb, slidefade 20%
}

dwindle {
    pseudotile = true
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad { natural_scroll = true }
}

gestures {
    workspace_swipe = true
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

windowrulev2 = float, class:^(pavucontrol|blueman-manager|nm-connection-editor|auxo-welcome)$
windowrulev2 = float, title:^(Picture-in-Picture)$

# ── keys ─────────────────────────────────────────────────────────────
bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, E, exec, $files
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod, L, exec, hyprlock
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mod, Print, exec, grim - | wl-copy
bind = $mod, T, exec, $terminal -e auxo-tweak

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
