source = ~/.config/auxo/colors-hyprland.conf
background {
    path = ~/.config/auxo/wallpaper.png
    blur_passes = 3
    brightness = 0.6
}
label {
    text = $TIME
    font_size = 72
    font_family = Inter ExtraBold
    color = rgba(e8e8f0ff)
    position = 0, 160
    halign = center
    valign = center
}
input-field {
    size = 320, 56
    outline_thickness = 2
    outer_color = $accent
    inner_color = rgba(15151eee)
    font_color = rgba(e8e8f0ff)
    placeholder_text = <i>climb back in…</i>
    rounding = 14
    position = 0, -40
    halign = center
    valign = center
}
