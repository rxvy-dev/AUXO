# Auxo Hyprland · Mac style lock screen
source = ~/.config/auxo/colors-hyprland.conf
general {
    hide_cursor = true
    grace = 0
}
background {
    path = ~/.config/auxo/wallpaper.png
    blur_passes = 4
    blur_size = 8
    brightness = 0.7
}
label {
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = Inter SemiBold
    color = rgba(ffffffdd)
    position = 0, 290
    halign = center
    valign = center
}
label {
    text = $TIME
    font_size = 110
    font_family = Inter Bold
    color = rgba(ffffffee)
    position = 0, 190
    halign = center
    valign = center
}
image {
    path = ~/.face
    size = 96
    rounding = -1
    border_size = 0
    position = 0, -80
    halign = center
    valign = center
}
label {
    text = $USER
    font_size = 16
    font_family = Inter SemiBold
    color = rgba(ffffffee)
    position = 0, -150
    halign = center
    valign = center
}
input-field {
    size = 240, 40
    outline_thickness = 0
    inner_color = rgba(ffffff30)
    font_color = rgba(ffffffff)
    placeholder_text = Enter Password
    rounding = 20
    fade_on_empty = false
    position = 0, -200
    halign = center
    valign = center
}
