# ── Auxo Hyprland · Mac style ────────────────────────────────────────
# A menu bar on top, a dock at the bottom, Spotlight-style search on Super+Space.
# Back to the normal Auxo style: auxo-tweak rice hyprland

# Liquid Glass: heavy, bright blur that picks up the wallpaper's colours, with a little grain
decoration {
    blur {
        enabled = true
        size = 9
        passes = 4
        noise = 0.018
        contrast = 1.02
        brightness = 1.08
        vibrancy = 0.42
        vibrancy_darkness = 0.25
        popups = true
    }
}

# soft, deep shadows and no coloured border glow
decoration {
    shadow {
        enabled = true
        range = 32
        render_power = 4
        color = rgba(00000070)
        color_inactive = rgba(00000040)
        offset = 0, 8
    }
    dim_inactive = false
}
general {
    col.active_border = rgba(ffffff26)
    col.inactive_border = rgba(ffffff12)
}

# windows zoom in and out like on a Mac; spaces slide sideways
animations {
    bezier = smooth, 0.25, 0.9, 0.3, 1
    animation = windows, 1, 4, smooth, popin 88%
    animation = windowsOut, 1, 3, smooth, popin 88%
    animation = workspaces, 1, 5, smooth, slide
    animation = fade, 1, 4, smooth
    animation = border, 0
    animation = borderangle, 0
}

# the menu bar, dock and search get frosted glass
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, wofi
layerrule = ignorezero, wofi
layerrule = animation popin 92%, wofi

# Auxo's Launchpad, Control Center and Spotlight-style search, floating glass panels
windowrulev2 = float, class:^(auxo-launchpad|auxo-control)$
windowrulev2 = noborder, class:^(auxo-launchpad|auxo-control)$
windowrulev2 = rounding 32, class:^(auxo-launchpad)$
windowrulev2 = rounding 34, class:^(auxo-control)$
windowrulev2 = center, class:^(auxo-launchpad)$
# (the Control Center places itself top-right; see auxo_glass.place)
windowrulev2 = animation popin 90%, class:^(auxo-launchpad|auxo-control)$

# Keys: the same as every Auxo rice (hyprland.conf). Mac look only: Super+Space opens
# Spotlight-style search, Super+A the Launchpad, Super+C the Control Center.
unbind = $mod, Space
bind = $mod, Space, exec, pkill wofi || wofi --show drun --conf ~/.config/wofi/spotlight --style ~/.config/wofi/spotlight.css

# small tool windows float, centred
windowrulev2 = float, class:^(auxo-settings|org.gnome.Calculator)$
windowrulev2 = center, floating:1
