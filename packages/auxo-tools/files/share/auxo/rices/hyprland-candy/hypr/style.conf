# ── Auxo Hyprland · Candy style ──────────────────────────────────────
# Pastel and round: soft pink-to-lavender borders, floating island bars, bouncy windows.
# Back to the normal Auxo style: auxo-tweak style auxo

general {
    col.active_border = rgb(ff8fc6) rgb(a98bff) rgb(6fdcbf) 120deg
    col.inactive_border = rgba(ffffff55)
}
decoration {
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(a98bff40)
        offset = 0, 6
    }
    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.25
    }
}
animations {
    bezier = bounce, 0.34, 1.56, 0.64, 1
    animation = windows, 1, 5, bounce, popin 70%
    animation = windowsOut, 1, 4, default, popin 80%
    animation = workspaces, 1, 5, bounce, slide
    animation = fade, 1, 4, default
    animation = border, 1, 10, default
    animation = borderangle, 1, 80, default, loop
}
layerrule = blur, waybar
layerrule = ignorezero, waybar
