source = ~/.config/auxo/colors-hyprland.conf
background {
    path = ~/.config/auxo/wallpaper.png
    blur_passes = 3
    brightness = 0.9
}
label {
    text = $TIME
    font_size = 72
    font_family = Inter ExtraBold
    color = rgba(e8e8f0ff)
    position = 0, 160
    halign = center
    valign = center
}
input-field {
    size = 320, 56
    outline_thickness = 2
    outer_color = rgb(ff8fc6) rgb(a98bff) 45deg
    inner_color = rgba(fff5faee)
    font_color = rgba(4a3a5cff)
    placeholder_text = <i>welcome back ♡</i>
    rounding = 28
    position = 0, -40
    halign = center
    valign = center
}
