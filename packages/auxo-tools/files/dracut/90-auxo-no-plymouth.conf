# Auxo has no boot splash. dracut puts Plymouth into the initramfs whenever the plymouth
# package is installed (even as another package's dependency), and on runit nothing ever
# closes it, so the system sits on the splash forever. Keep it out. This also overrides
# the add_dracutmodules line older Auxo versions wrote to /etc/dracut.conf.d/auxo-splash.conf.
omit_dracutmodules+=" plymouth "
