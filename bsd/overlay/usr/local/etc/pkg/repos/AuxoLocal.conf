# Graphics drivers and guest tools shipped on the AuxoBSD ISO, so `auxo-tweak nvidia` and
# `auxo-tweak drivers` work without internet (every NVIDIA branch: 580, 470, 390, 340).
# pkg prefers the FreeBSD repositories; auxo-tweak falls back to this one when offline.
AuxoLocal: {
    url: "file:///usr/local/share/auxo/pkgs",
    enabled: yes,
    priority: 0
}
