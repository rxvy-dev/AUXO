# AuxoBSD live ISO (the installer writes a fresh rc.conf for the installed system)
hostname="auxobsd-live"
root_rw_mount="NO"
ifconfig_DEFAULT="DHCP"
background_dhclient="YES"
dbus_enable="YES"
sddm_enable="YES"
seatd_enable="YES"
ntpd_enable="YES"
ntpd_sync_on_start="YES"
powerd_enable="YES"
sendmail_enable="NONE"
sshd_enable="NO"
dumpdev="NO"
osrelease_enable="NO"
update_motd="NO"
syslogd_flags="-ss"
