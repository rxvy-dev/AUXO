# AuxoBSD live ISO boot settings
vfs.root.mountfrom="cd9660:/dev/iso9660/AUXOBSD"
autoboot_delay="5"
loader_logo="auxo"
loader_brand="auxobsd"
kern.vty="vt"
zfs_load="YES"
fusefs_load="YES"
tmpfs_load="YES"
unionfs_load="YES"
nullfs_load="YES"
hw.nvidiadrm.modeset="1"
kern.geom.label.disk_ident.enable="0"
kern.geom.label.gptid.enable="0"
