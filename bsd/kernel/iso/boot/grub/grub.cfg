# AuxoBSD boot menu. /boot/rootfs.tar is the root filesystem (GCC, BusyBox, …; tools/mkrootfs.sh). Auxo settings go on the multiboot2 line (see `auxo-tweak persist`):
#   accent=violet|cyan|emerald|amber|rose|blue|mono  hostname=NAME  motd=0  nocolor
set timeout=2
set default=0
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-magenta

insmod all_video

menuentry "AuxoBSD 0.1.0 (Chrono desktop)" {
    set gfxpayload=1920x1080x32,1600x900x32,1366x768x32,1280x800x32,1024x768x32,auto
    echo "Loading AuxoBSD: about 350 MB, this can take a minute in a virtual machine..."
    multiboot2 /boot/auxobsd.elf accent=violet
    if [ -f /boot/rootfs.tar ]; then module2 /boot/rootfs.tar rootfs; fi
    if [ -f /boot/overlay.tar ]; then module2 /boot/overlay.tar overlay; fi
    module2 /boot/auxobsd.elf kernel
    if [ -f /boot/install.img ]; then module2 /boot/install.img installer; fi
    boot
}

# UEFI has no VGA text mode (VirtualBox, Hyper-V and every recent PC boot that way): there the
# text entries keep the firmware's graphics mode and `text` has the kernel draw the console on it.
menuentry "AuxoBSD 0.1.0 (text console)" {
    if [ "$grub_platform" = "efi" ]; then set gfxpayload=keep; else set gfxpayload=text; fi
    echo "Loading AuxoBSD: about 350 MB, this can take a minute in a virtual machine..."
    multiboot2 /boot/auxobsd.elf accent=violet text
    if [ -f /boot/rootfs.tar ]; then module2 /boot/rootfs.tar rootfs; fi
    if [ -f /boot/overlay.tar ]; then module2 /boot/overlay.tar overlay; fi
    boot
}

menuentry "AuxoBSD 0.1.0 (plain serial, no colour)" {
    if [ "$grub_platform" = "efi" ]; then set gfxpayload=keep; else set gfxpayload=text; fi
    echo "Loading AuxoBSD..."
    multiboot2 /boot/auxobsd.elf accent=violet nocolor text
    boot
}

menuentry "Reboot" { reboot }
menuentry "Power off" { halt }
