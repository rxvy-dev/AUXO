# AuxoBSD boot menu. Auxo settings go on the multiboot2 line (see `auxo-tweak persist`):
#   accent=violet|cyan|emerald|amber|rose|blue|mono  hostname=NAME  motd=0  nocolor
set timeout=2
set default=0
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-magenta

menuentry "AuxoBSD 0.1.0" {
    multiboot2 /boot/auxobsd.elf accent=violet
    boot
}

menuentry "AuxoBSD 0.1.0 (plain serial, no colour)" {
    multiboot2 /boot/auxobsd.elf accent=violet nocolor
    boot
}

menuentry "Reboot" { reboot }
menuentry "Power off" { halt }
