name: Build Hyprland packages

# Void doesn't package Hyprland, so Auxo builds it (packages/hyprland). Each build is published
# as a "hyprland-*" pre-release; the ISO build puts the newest on the ISO and attaches it to the
# ISO's release as hyprland-x86_64.tar, where auxo-tweak and auxo-update download it from.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["packages/hyprland/**", ".github/workflows/build-hyprland.yml"]
  schedule:
    - cron: "41 3 1 * *"   # monthly: rebuild against whatever Void has moved to

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --platform linux/amd64 --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare the container
        shell: sh       # Void's image has no bash until this installs it
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps && xbps-install -yu && xbps-install -y sudo bash grep curl git github-cli

      - name: Get the source
        run: |
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" /src
          git -C /src fetch --depth 1 origin "$GITHUB_SHA" && git -C /src checkout -q "$GITHUB_SHA"

      - name: Build Hyprland and its libraries
        run: OUT=/out sh /src/packages/hyprland/build.sh

      - name: Check that it installs on current Void
        run: |
          xbps-install -y -R /out/pkgs -R https://repo-ci.voidlinux.org/current -n \
            hyprland hyprlock hypridle hyprpaper xdg-desktop-portal-hyprland | tail -25

      - name: Check Auxo's three Hyprland styles with Hyprland itself
        run: |
          xbps-install -y -R /out/pkgs -R https://repo-ci.voidlinux.org/current hyprland python3 >/dev/null
          id hyprcheck >/dev/null 2>&1 || useradd -m hyprcheck   # Hyprland won't run as root
          export XDG_RUNTIME_DIR=$(mktemp -d); chown hyprcheck "$XDG_RUNTIME_DIR"
          sudo -u hyprcheck env XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR Hyprland --version | head -1
          fail=0
          for style in hyprland hyprland-mac hyprland-win; do
            FR=$(mktemp -d); mkdir -p "$FR/etc/auxo" "$FR/home/t" "$FR/usr/share/auxo"
            echo "t:x:1000:1000::/home/t:/bin/sh" > "$FR/etc/passwd"; echo 'DESKTOP="hyprland"' > "$FR/etc/auxo/auxo.conf"
            ln -s /src/packages/auxo-tools/files/share/auxo/rices "$FR/usr/share/auxo/rices"
            AUXO_ROOT=$FR AUXO_DRY_RUN=1 AUXO_LIB=/src/packages/auxo-tools/files/lib \
              python3 /src/packages/auxo-tools/files/bin/auxo-tweak rice "$style" --user t >/dev/null
            chmod -R a+rX "$FR"
            out=$(sudo -u hyprcheck env HOME=$FR/home/t XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR Hyprland --verify-config -c "$FR/home/t/.config/hypr/hyprland.conf" 2>&1 || true)
            echo "── $style"; echo "$out" | tail -15
            echo "$out" | grep -qi "config ok" || { echo "::error::Hyprland rejects the $style config"; fail=1; }
          done
          exit $fail

      - name: Publish (a "hyprland-DATE-SHA" pre-release; the ISO build picks the newest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /src
          git config --global --add safe.directory /src
          tag="hyprland-$(date -u +%Y.%m.%d-%H%M)-${GITHUB_SHA::7}"
          gh release create "$tag" /out/hyprland-x86_64.tar --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Hyprland packages ($tag)" \
            --notes "Hyprland 0.49 and its libraries, built against current Void Linux by .github/workflows/build-hyprland.yml. The next ISO build puts these on the ISO and in its release (hyprland-x86_64.tar). Not a download for people."
          # keep the newest two
          gh release list --limit 100 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("hyprland-"))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' \
            | while read -r old; do gh release delete "$old" --yes --cleanup-tag || true; done

      - name: Keep the build log of a failed package
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hyprland-build-logs
          path: /work/void-packages/masterdir*/builddir/**/*.log
          if-no-files-found: ignore
