name: AuxoBSD kernel

on:
  workflow_dispatch:
  push:
    paths: ["bsd/kernel/**", "packages/auxo-tools/files/lib/auxo_accents.py", ".github/workflows/auxobsd-kernel.yml"]
  pull_request:
    paths: ["bsd/kernel/**", "packages/auxo-tools/files/lib/auxo_accents.py"]

jobs:
  kernel:
    runs-on: ubuntu-24.04            # AuxoBSD's root image and pkg are Ubuntu 24.04 (noble)
    timeout-minutes: 90
    defaults:
      run:
        working-directory: bsd/kernel
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -yq qemu-system-x86 grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools ovmf zlib1g-dev liblzma-dev libzstd1 libcrypt-dev curl gcc-multilib
          rustup target add x86_64-unknown-none

      - name: Accents match the Auxo Linux palette
        run: make accents-check

      - name: Root filesystem (GCC, binutils, make, BusyBox from Ubuntu packages)
        run: make rootfs

      - name: Installer boot template (GRUB for BIOS + an EFI system partition)
        run: make install-image

      - name: Build
        run: |
          rustc --version; gcc --version | head -1; qemu-system-x86_64 --version | head -1
          make && make check && make iso

      - name: Boot in QEMU and drive auxsh
        run: make test

      - name: Install onto a blank disk, then boot it (BIOS and UEFI)
        run: make test-install

      - name: USB keyboards and mice, no PS/2, ACPI power off
        run: make test-hw

      - name: Browser tabs, sign-in, cookies and saved passwords
        run: make test-browser

      - name: Sandbox holds against escape attempts; inotify, timers, pidfd and other Linux calls
        run: make test-sandbox

      - name: Sound (Intel HD Audio, ALSA) plays through aplay
        run: make test-sound

      - name: pkg installs Ubuntu packages, kept on an installed disk
        run: make test-pkg

      - name: Diagnose a failed boot (where the CPU faulted)
        if: failure()
        run: |
          readelf -lW build/auxobsd.elf | sed -n '/Program Headers/,/^$/p'
          readelf -SW build/auxobsd.elf | grep -vE "debug|symtab|strtab"
          timeout 25 qemu-system-x86_64 -cdrom build/auxobsd.iso -display none -m 256M -no-reboot \
              -serial file:build/serial.log -d int,cpu_reset,guest_errors -D build/qemu-int.log || true
          echo "--- serial"; head -c 2000 build/serial.log || true; echo
          echo "--- exceptions (last 15)"; grep -E "check_exception|Triple fault|^ *[0-9]+: v=" build/qemu-int.log | tail -15 || true
          echo "--- where"
          for rip in $(grep -oE "pc=[0-9a-f]+|RIP=[0-9a-f]+" build/qemu-int.log | tail -4 | cut -d= -f2 | sort -u); do
              printf '%s  ' "$rip"; addr2line -f -C -e build/auxobsd.elf "0x$rip" | tr '\n' ' '; echo
          done
          grep -B2 -A12 "check_exception" build/qemu-int.log | tail -60 || true

      - name: Upload ISO and QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auxobsd-kernel-iso
          path: |
            bsd/kernel/build/auxobsd.iso
            bsd/kernel/build/auxobsd.elf
            bsd/kernel/build/qemu-*.log
          if-no-files-found: ignore

  # The ISO for using it day to day: the same kernel with the full root image (GNOME Web for
  # the whole web: HTML, CSS, JavaScript; D-Bus; Mesa). Bigger and slower to boot live
  # (give the machine 4 GB); installed, it runs from the disk.
  full-iso:
    needs: kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bsd/kernel
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -yq qemu-system-x86 grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools zlib1g-dev liblzma-dev libzstd1 libcrypt-dev curl
          rustup target add x86_64-unknown-none

      - name: Full root filesystem (GNOME Web, D-Bus, Mesa, GCC, …)
        run: ROOTFS_SET=full make rootfs

      - name: Installer boot template
        run: make install-image

      - name: Build the ISO
        run: make && make iso

      - name: Upload the full ISO
        uses: actions/upload-artifact@v4
        with:
          name: auxobsd-full-iso
          path: bsd/kernel/build/auxobsd.iso
          if-no-files-found: error
