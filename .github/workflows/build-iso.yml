name: Build Auxo ISO

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1"   # weekly fresh ISO (Mondays)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space (the build needs ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h /

      - uses: actions/checkout@v4

      - name: Run the tests
        run: |
          pip install --quiet pyte
          ./tests/test-tools.sh
          python3 tests/test-installer.py

      - name: Build the ISO in a Void container (void-mklive)
        run: |
          ./build.sh
          sudo chown -R "$USER" out
          ls -lh out

      - name: Enable KVM for the VM test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q && sudo apt-get install -yq qemu-system-x86 xorriso socat imagemagick

      - name: Boot the ISO in QEMU (smoke test)
        run: ./scripts/smoke-test.sh out/auxo-linux-*.iso 600

      - name: Upload smoke-test screenshot + serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: out/smoke/

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: auxo-linux-iso
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          iso=$(ls auxo-linux-*.iso)
          # release assets are limited to 2 GiB → split large ISOs
          if [ "$(stat -c%s "$iso")" -gt 2000000000 ]; then
            split -b 1900M -d "$iso" "$iso.part"
            files="$iso.part* $iso.sha256"
            note="Download all parts, then: cat $iso.part* > $iso && sha256sum -c $iso.sha256"
          else
            files="$iso $iso.sha256"
            note="Verify with: sha256sum -c $iso.sha256"
          fi
          gh release create "${GITHUB_REF_NAME}" $files --title "Auxo Linux ${GITHUB_REF_NAME}" --notes "$note" \
            || gh release upload "${GITHUB_REF_NAME}" $files --clobber
