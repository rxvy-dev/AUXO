name: Build Auxo ISO

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main, auxo-beta]   # only builds when the commit message says [build iso] (see the job's if:)
  schedule:
    - cron: "17 4 * * 1"   # weekly fresh ISO (Mondays)

permissions:
  contents: write
  id-token: write       # build provenance: anyone can check an ISO really came from this workflow
  attestations: write

jobs:
  build:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[build iso]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space (the build needs ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h /

      - uses: actions/checkout@v4

      - name: Run the tests
        run: |
          pip install --quiet pyte PyQt6
          # Qt (offscreen) needs these for the GUI tests: Settings, installer, launcher, control center
          sudo apt-get install -y -qq libegl1 libxkbcommon0 libfontconfig1 libglib2.0-0t64 >/dev/null 2>&1 || sudo apt-get install -y -qq libegl1 libxkbcommon0 libfontconfig1 >/dev/null 2>&1 || true
          ./tests/test-tools.sh
          python3 tests/test-installer.py
          python3 tests/test-installer-gui.py
          python3 tests/test-summit.py
          python3 tests/test-settings.py
          python3 tests/test-monitor.py
          python3 tests/test-overview.py
          sh tests/test-wallpaper.sh
          python3 tests/test-store.py
          python3 tests/test-sound.py
          pip install --quiet pillow
          python3 tests/test-features.py
          python3 tests/keymap-parity.py

      - name: Get Auxo's Hyprland packages (newest build-hyprland release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          tag=$(gh release list --limit 100 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("hyprland-"))] | sort_by(.createdAt) | reverse | .[0].tagName // empty')
          if [[ -n $tag ]]; then
            gh release download "$tag" -p hyprland-x86_64.tar -D out --clobber && echo "Hyprland packages: $tag" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No Hyprland packages yet (run 'Build Hyprland packages'): Hyprland won't install from this ISO."
          fi

      - name: Build the ISO in a Void container (void-mklive)
        run: |
          ./build.sh --docker
          sudo chown -R "$USER" out
          ls -lh out

      - name: Check the ISO size (1.5–2 GB, one download)
        run: |
          iso=$(ls out/auxo-linux-*.iso); size=$(stat -c%s "$iso"); mb=$((size / 1000000))
          echo "### ISO size: ${mb} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 2000000000 ]; then
            echo "::error::The ISO is ${mb} MB, over the 2 GB limit (GitHub release files must be under 2 GB). Trim mklive/packages.txt."
            exit 1
          elif [ "$size" -lt 1500000000 ]; then
            echo "::warning::The ISO is ${mb} MB, under the 1.5 GB target. Fine to ship."
          else
            echo "ISO is ${mb} MB: inside the 1.5–2 GB target"
          fi

      - name: Enable KVM for the VM test
        timeout-minutes: 8      # apt on the runner once hung for 20+ minutes here
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          for try in 1 2 3; do timeout 150 sudo apt-get update -q && timeout 240 sudo apt-get install -yq qemu-system-x86 xorriso socat imagemagick && break; echo "apt attempt $try failed, retrying"; sleep 5; done

      - name: Boot the ISO in QEMU (smoke test)
        run: ./scripts/smoke-test.sh out/auxo-linux-*.iso 600

      - name: Upload smoke-test screenshot + serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: out/smoke/

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: auxo-linux-iso
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0

      - name: Attest build provenance (gh attestation verify <iso> -R rxvy-dev/AUXO)
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            out/auxo-linux-*.iso
            out/repo/*.xbps

      - name: Publish (a release for tags, a dated nightly marked "latest" otherwise)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          iso=$(ls auxo-linux-*.iso)
          files="$iso $iso.sha256"     # under 2 GB: checked by the size step above
          # Auxo's own packages (auxo-update installs newer ones from here) and Hyprland (built by
          # Auxo); fixed names, so releases/latest/download/<name> always finds the newest
          tar -cf auxo-packages-x86_64.tar -C repo .
          files="$files auxo-packages-x86_64.tar"
          [[ -f hyprland-x86_64.tar ]] && files="$files hyprland-x86_64.tar"
          note="Verify with: sha256sum -c $iso.sha256"
          if [[ "$GITHUB_REF_NAME" == auxo-beta ]]; then
            # public beta: a prerelease that never becomes "latest", so auxo-update on stable installs
            # ignores it. The tag points at main's commit (GITHUB_TOKEN may not tag a commit whose
            # workflows differ from main's); the notes name the real beta commit.
            ver=$(cut -d. -f1,2 ../VERSION 2>/dev/null || echo 5.0)
            tag="beta-${ver}-$(date -u +%Y.%m.%d-%H%M)-${GITHUB_SHA::7}"
            main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            gh release create "$tag" $files --target "$main_sha" --prerelease --latest=false \
              --title "AUXO Linux ${ver} beta ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
              --notes "THIS IS A BETA VERSION OF AUXO LIKELY TO BE UNSTABLE! Built from the auxo-beta branch, commit $GITHUB_SHA (https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA), and booted in a VM before upload. What's new: https://github.com/$GITHUB_REPOSITORY/blob/auxo-beta/CHANGELOG.md — $note"
            gh release list --limit 100 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("beta-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
              | while read -r old; do gh release delete "$old" --yes --cleanup-tag || true; done
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "${GITHUB_REF_NAME}" $files --title "Auxo Linux ${GITHUB_REF_NAME}" --notes "$note" \
              || gh release upload "${GITHUB_REF_NAME}" $files --clobber
          else
            # a new tag per build: with immutable releases, a tag name can't be reused once released
            tag="nightly-$(date -u +%Y.%m.%d-%H%M)-${GITHUB_SHA::7}"   # time too: a rebuild of the same commit gets its own tag
            gh release create "$tag" $files --target "$GITHUB_SHA" --latest \
              --title "Auxo Linux $(date -u +%Y-%m-%d) (${GITHUB_SHA::7})" \
              --notes "Built from main by GitHub Actions and booted in a VM before upload. Newest build is always at https://github.com/rxvy-dev/AUXO/releases/latest — $note"
            # keep the newest three builds
            gh release list --limit 100 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("nightly-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
              | while read -r old; do gh release delete "$old" --yes --cleanup-tag || true; done
          fi
