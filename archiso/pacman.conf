# pacman.conf used ONLY while building the ISO (mkarchiso -C).
# The installed system gets the stock /etc/pacman.conf plus tweaks from the installer.
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 8
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
Color
ILoveCandy

# Local repo with calamares + auxo-tools, created by build.sh.
# build.sh rewrites AUXO_LOCAL_REPO to an absolute path before building.
[auxo]
SigLevel = Optional TrustAll
Server = file://AUXO_LOCAL_REPO

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
