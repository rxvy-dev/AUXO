# Desktop / window manager. Plasma is on the live medium and works offline;
# everything else is downloaded during install and comes pre-riced by Auxo.
---
mode: required
method: legacy
labels:
    step: "Desktop"
items:
    - id: plasma
      name: "KDE Plasma"
      description: "The live desktop you're using right now, with the Auxo global theme: dark, your accent colour and a floating dock-style panel. Fully Wayland. Installs offline."
      screenshot: "/etc/calamares/branding/auxo/desktops/plasma.png"
    - id: hyprland
      name: "Hyprland — Auxo rice"
      description: "Animated tiling Wayland compositor, pre-configured by Auxo: waybar, wofi, mako, hyprlock, your accent colour on every border. Needs internet."
      screenshot: "/etc/calamares/branding/auxo/desktops/hyprland.png"
    - id: gnome
      name: "GNOME"
      description: "Stock GNOME with its own login screen. Your accent maps to GNOME's accent colours. Needs internet."
      screenshot: "/etc/calamares/branding/auxo/desktops/gnome.png"
    - id: sway
      name: "Sway — Auxo rice"
      description: "i3-compatible tiling on Wayland, pre-configured with waybar, wofi, foot and mako. Needs internet."
      screenshot: "/etc/calamares/branding/auxo/desktops/sway.png"
    - id: i3
      name: "i3 — Auxo rice"
      description: "The classic X11 tiling window manager with polybar, rofi, picom and dunst, pre-configured. Needs internet."
      screenshot: "/etc/calamares/branding/auxo/desktops/i3.png"
    - id: xfce
      name: "Xfce"
      description: "Lightweight and traditional. Great on older hardware. Needs internet."
      screenshot: "/etc/calamares/branding/auxo/desktops/xfce.png"
    - id: cinnamon
      name: "Cinnamon"
      description: "A familiar, Windows-like layout. Needs internet."
      screenshot: "/etc/calamares/branding/auxo/desktops/cinnamon.png"
    - id: none
      name: "No desktop"
      description: "Boots to a TTY. Add any desktop later with: auxo-tweak desktop <name>."
      screenshot: "/etc/calamares/branding/auxo/desktops/none.png"
