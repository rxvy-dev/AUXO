# Strip everything that only belongs on the live medium, and put the
# kernel back into /boot (mkarchiso empties /boot inside the squashfs).
---
dontChroot: false
timeout: 300
verbose: true
script:
    - command: "/etc/calamares/scripts/auxo-cleanlive"
      timeout: 300
i18n:
    name: "Removing live-session files"
