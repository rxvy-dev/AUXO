# Auxo Linux — Calamares configuration
---
modules-search: [ local, /usr/share/auxo/calamares-modules ]

instances:
- id:     desktop
  module: packagechooser
  config: packagechooser_desktop.conf
- id:     kernel
  module: packagechooser
  config: packagechooser_kernel.conf
- id:     accent
  module: packagechooser
  config: packagechooser_accent.conf
- id:     shell
  module: packagechooser
  config: packagechooser_shell.conf
- id:     cleanlive
  module: shellprocess
  config: shellprocess_cleanlive.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - packagechooser@desktop
  - packagechooser@accent
  - packagechooser@kernel
  - packagechooser@shell
  - netinstall
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - luksopenswaphookcfg
  - shellprocess@cleanlive
  - networkcfg
  - hwclock
  - auxoprepare
  - packages
  - users
  - auxodesktop
  - initcpiocfg
  - initcpio
  - grubcfg
  - bootloader
  - auxosnap
  - services-systemd
  - preservefiles
  - umount
- show:
  - finished

branding: auxo
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
