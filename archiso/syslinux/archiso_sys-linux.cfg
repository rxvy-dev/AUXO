LABEL auxo
TEXT HELP
Boot Auxo Linux live. Try the desktop, then launch the installer.
ENDTEXT
MENU LABEL Auxo Linux - live & install (BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=3 copytoram=n

LABEL auxonvidia
TEXT HELP
Load the NVIDIA open kernel driver (RTX 20-series and newer).
ENDTEXT
MENU LABEL Auxo Linux - NVIDIA GPU
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=3 auxo.nvidia=1 nvidia_drm.modeset=1 nvidia_drm.fbdev=1 modprobe.blacklist=nouveau copytoram=n

LABEL auxosafe
TEXT HELP
Use basic framebuffer graphics if the screen stays black.
ENDTEXT
MENU LABEL Auxo Linux - safe graphics (nomodeset)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=3 nomodeset copytoram=n
